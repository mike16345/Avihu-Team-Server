name: Server Tests

on:
  pull_request:
    branches: ["**"]
  push:
    branches:
      - devel

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests and build readable report
        id: test_report
        continue-on-error: true
        run: npm run test:report

      - name: Add readable test summary
        if: always()
        working-directory: .
        run: |
          if [ -f ".test-report/summary.md" ]; then
            cat ".test-report/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Test reporting failed before a summary could be generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload readable test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ github.run_id }}
          path: .test-report/
          include-hidden-files: true
          if-no-files-found: warn

      - name: Check test-report email credentials
        id: smtp_credentials
        if: always() && hashFiles('.test-report/email.eml') != ''
        working-directory: .
        env:
          TEST_REPORT_SMTP_USER: ${{ secrets.TEST_REPORT_SMTP_USER }}
          TEST_REPORT_SMTP_APP_PASSWORD: ${{ secrets.TEST_REPORT_SMTP_APP_PASSWORD }}
        run: |
          if [ -n "$TEST_REPORT_SMTP_USER" ] && [ -n "$TEST_REPORT_SMTP_APP_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Email test report
        id: send_test_report_email
        if: always() && hashFiles('.test-report/email.eml') != '' && steps.smtp_credentials.outputs.available == 'true'
        continue-on-error: true
        working-directory: .
        env:
          TEST_REPORT_SMTP_USER: ${{ secrets.TEST_REPORT_SMTP_USER }}
          TEST_REPORT_SMTP_APP_PASSWORD: ${{ secrets.TEST_REPORT_SMTP_APP_PASSWORD }}
        run: |
          curl --fail-with-body --silent --show-error \
            --url "smtps://smtp.gmail.com:465" --ssl-reqd \
            --mail-from "${TEST_REPORT_SMTP_USER}" \
            --mail-rcpt "michaelgani815@gmail.com" \
            --user "${TEST_REPORT_SMTP_USER}:${TEST_REPORT_SMTP_APP_PASSWORD}" \
            --upload-file ".test-report/email.eml"

      - name: Record missing test-report email credentials
        if: always() && hashFiles('.test-report/email.eml') != '' && steps.smtp_credentials.outputs.available != 'true'
        working-directory: .
        run: echo "Test report email skipped because SMTP secrets are unavailable." >> "$GITHUB_STEP_SUMMARY"

      - name: Record test-report email delivery error
        if: always() && steps.send_test_report_email.outcome == 'failure'
        working-directory: .
        run: echo "Test report email delivery failed; the report artifact is still available." >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve failed test status
        if: always() && steps.test_report.outcome == 'failure'
        working-directory: .
        run: exit 1
